[workspace]
resolver = "2"
members = ["crates/moonlock-core", "crates/moonlock-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nguyễn Thanh Phú <thanhphu2643@gmail.com>"]
repository = "https://github.com/thanhphu2643/Moonlock"
homepage = "https://github.com/thanhphu2643/Moonlock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
moonlock-core = { path = "crates/moonlock-core" }
