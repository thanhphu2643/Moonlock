[package]
name = "moonlock-app"
description = "Moonlock — Tauri 2 desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "moonlock_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Builds & links the Swift package (swift/MoonlockKit) for Apple targets — see build.rs.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
moonlock-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
time = "0.3"
